<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Ingresa tus datos para continuar</p>
<
    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          [(ngModel)]="correo" 
          placeholder="ejemplo@correo.com" 
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    //pruebas 
    <div class="test-helpers">
     
      <div style="display: flex; gap: 5px; justify-content: center;">
        <button type="button" (click)="llenarPrueba('usuario@gmail.com')" class="btn-sm">Usuario</button>
        <button type="button" (click)="llenarPrueba('cafe@gmail.com')" class="btn-sm">Cafetería</button>
        <button type="button" (click)="llenarPrueba('admin@gmail.com')" class="btn-sm">Admin</button>
      </div>
    </div>

    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
