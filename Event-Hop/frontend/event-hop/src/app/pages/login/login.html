<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Ingresa tus datos para continuar</p>
    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          [(ngModel)]="correo" 
          placeholder="ejemplo@correo.com" 
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required>
      </div>

      <p *ngIf="error" role="alert">{{ error }}</p>
      <button type="submit" class="btn-primary" [disabled]="enviando">{{ enviando ? 'Ingresando...' : 'Entrar' }}</button>
    </form>


    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
