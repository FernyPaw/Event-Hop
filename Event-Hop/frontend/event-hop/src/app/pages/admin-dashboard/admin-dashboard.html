<div class="container">
  <h2>Panel de Administración - Event-Hop</h2>

  <div class="row">
    <!-- Usuarios -->
    <div class="card">
      <h5>Usuarios Registrados</h5>
      <h3 class="text-primary">{{ totalUsuarios }}</h3>
    </div>

    <!-- Cafeterias-->
    <div class="card">
      <h5>Cafeterías Aceptadas</h5>
      <h3 class="text-success">{{ cafeteriasAceptadas }}</h3>
    </div>

    <!-- solicitudes -->
    <div class="card">
      <h5>Solicitudes Totales</h5>
      <h3 class="text-warning">{{ totalSolicitudesCafeterias }}</h3>
    </div>

    <!-- Eventos -->
    <div class="card">
      <h5>Eventos Totales</h5>
      <h3 class="text-info">{{ totalEventos }}</h3>
    </div>
  </div>
</div>
